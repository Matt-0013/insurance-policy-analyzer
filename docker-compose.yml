services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your shell or a .env file}
    volumes:
      # Keep the index, chunks and PDFs on the host so restarts are cheap.
      - ./data:/app/data

  ui:
    build: .
    command:
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
    ports:
      - "8501:8501"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in your shell or a .env file}
      API_URL: http://api:8000
    volumes:
      - ./data:/app/data
    depends_on:
      - api
