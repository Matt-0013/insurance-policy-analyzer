[project]
name = "insurance-policy-analyzer"
version = "0.1.0"
description = "Advanced RAG over Indian health insurance policies: hybrid retrieval, grounded answers with page citations, and measured retrieval quality"
readme = "README.md"
authors = [
    { name = "Matt-0013", email = "saiarun581@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "bm25s>=0.3.16",
    "chromadb>=1.5.9",
    "fastapi>=0.162.4",
    "groq>=1.7.0",
    "langchain-community<0.3.26",
    "langchain-openai>=0.3.35",
    "pymupdf4llm>=2.1",
    "python-dotenv>=1.2.4",
    "ragas>=0.4.3",
    "sentence-transformers>=6.2.0",
    "streamlit>=1.67.0",
    "uvicorn[standard]>=0.54.0",
    "wordninja>=2.0.0",
]

[project.scripts]
insurance-policy-analyzer = "insurance_policy_analyzer:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]
